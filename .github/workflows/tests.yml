name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Must stay in step with composer.json: php ^8.5 and
        # illuminate/support ^13.35. A lane outside those constraints cannot
        # resolve — laravel/framework replaces illuminate/support, so a 12.x
        # framework can never satisfy a ^13 requirement.
        os: [ubuntu-latest, windows-latest]
        php: [8.5]
        laravel: [13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl, gd
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: PHPStan
        if: runner.os != 'Windows'
        run: composer analyse

      - name: PHPStan (Windows)
        if: runner.os == 'Windows'
        run: vendor/bin/phpstan analyse --configuration=phpstan.windows.neon --no-progress

      - name: Linter
        run: composer lint:check

      - name: Type Coverage
        if: runner.os != 'Windows'
        run: composer test:types

      - name: Test Suite
        if: runner.os != 'Windows'
        run: composer test:unit

      - name: Test Suite (Windows)
        if: runner.os == 'Windows'
        run: vendor/bin/pest

  # Regenerates openapi.json and client/ and fails when anything differs from
  # what is committed. This is the authoritative check of the generated
  # TypeScript; tests/OpenApi/OpenApiTest.php only compares the stamp.
  client:
    runs-on: ubuntu-latest

    name: OpenAPI and TypeScript client

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl, gd
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Generate the OpenAPI document and the client
        run: composer client:generate

      - name: Fail on a stale openapi.json or client
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain -- openapi.json client)"

  # Showroom's Atrium front-end module (atrium/, built to dist/atrium): a
  # frozen install, typecheck, Vitest and the build, which must reproduce the
  # committed dist/atrium byte for byte. The PHP suite stays Node-free and
  # checks the build's source hash instead (tests/Feature/AtriumModuleTest.php).
  ui:
    runs-on: ubuntu-latest

    name: Atrium module

    defaults:
      run:
        working-directory: atrium

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: atrium/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: atrium/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Committed build matches a fresh build
        run: |
          git diff --exit-code -- ../dist/atrium
          test -z "$(git status --porcelain -- ../dist/atrium)"
